backend:
  name: github
  repo: EdsonMore/web_sinole # CAMBIAR: tu-usuario/nombre-del-repositorio
  branch: main
  base_url: https://websinole.vercel.app
  auth_endpoint: api/auth

# Para editar en tu PC sin GitHub: ejecutar `npx decap-server` junto a `npm run dev`
local_backend: true

locale: es
media_folder: public/images/noticias
public_folder: /images/noticias

collections:
  - name: noticias
    label: Noticias
    label_singular: Noticia
    folder: src/content/noticias
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: [fecha, titulo]
    fields:
      - { label: Título, name: titulo, widget: string }
      - { label: Fecha, name: fecha, widget: datetime, date_format: DD/MM/YYYY, time_format: false, format: YYYY-MM-DD }
      - { label: Categoría, name: categoria, widget: select, options: [Comunicado, Petroperú, Talara, Oleoducto, FEDUNPE, Convocatoria], default: Comunicado }
      - label: Imágenes (la primera es la portada)
        name: imagenes
        widget: list
        required: false
        default: []
        field: { label: Imagen, name: imagen, widget: image }
      - { label: Resumen (1-2 líneas), name: resumen, widget: text }
      - label: Enlaces a redes (Facebook, TikTok, Instagram)
        name: enlaces_redes
        widget: list
        required: false
        default: []
        hint: Pega el enlace completo de la publicación, uno por ítem.
        field: { label: Enlace, name: enlace, widget: string, pattern: ['^https://', 'Debe empezar con https://'] }
      - { label: Contenido, name: body, widget: markdown }
